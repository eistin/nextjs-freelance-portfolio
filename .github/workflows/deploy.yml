name: Deploy
on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [profile-updated]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/eistin/nextjs-freelance-portfolio

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch profile artifact
        uses: actions/checkout@v4
        with:
          repository: eistin/profile-hub
          ref: main
          token: ${{ secrets.PROFILE_HUB_TOKEN }}
          sparse-checkout: dist/profile.json
          sparse-checkout-cone-mode: false
          path: .profile-hub

      - name: Place artifact at repo root
        run: |
          cp .profile-hub/dist/profile.json ./profile.json
          rm -rf .profile-hub
          node -e "const p=require('./profile.json'); console.log('artifact:', Object.keys(p.locales).length, 'locales,', p.locales.fr.missions.length, 'missions')"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and test
        run: |
          npm ci
          npm test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_BASE_URL=https://edwindev.cloud
            NEXT_PUBLIC_GA_MEASUREMENT_ID=G-QQ3GP98E89

      - name: Bump image tag in deploy manifests
        run: |
          sed -i "s/newTag: .*/newTag: ${{ github.sha }}/" deploy/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/kustomization.yaml
          git commit -m "chore(deploy): image ${{ github.sha }} [skip ci]"
          git push
